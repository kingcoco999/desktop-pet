{
  "appId": "com.desktop-pet.app",
  "productName": "Desktop Pet",
  "directories": {
    "output": "release"
  },
  "files": [
    "dist/**/*",
    "src/assets/**/*",
    "package.json"
  ],
  "win": {
    "target": "nsis",
    "icon": "resources/icon.ico"
  },
  "nsis": {
    "oneClick": false,
    "perMachine": true,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true
  }
}
